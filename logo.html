<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus | Logos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=1920&auto=format&fit=crop'); }
    </style>
</head>
<body>
    <nav>
        <div class="brand" onclick="location.href='index.html'">NEXUS</div>
        <div class="nav-links"><a href="logo.html" style="color:var(--neon-blue);">LOGOS</a><a href="qr.html">QR</a><a href="sticker.html">STICKERS</a></div>
    </nav>
    <div class="container">
        <h2 style="border-left:4px solid var(--neon-blue); padding-left:15px; color:white;">LOGO VAULT</h2>
        <div class="grid" id="grid"></div>
    </div>
    
    <script src="script.js"></script>
    <script>
        const products = JSON.parse(localStorage.getItem('nexus_products') || "[]");
        const items = products.filter(p => p.type === 'logo'); // CHANGE THIS FOR QR/STICKERS

        document.getElementById('grid').innerHTML = items.map(p => `
            <div class="card">
                <img src="${p.img}" loading="lazy">
                <h3>${p.name}</h3>
                <p style="color:var(--neon-purple); font-weight:bold; margin:5px 0 10px 0;">₹${p.price}</p>
                <button class="btn" onclick="buyItem('${p.name}', ${p.price}, '${p.img}')">ACQUIRE</button>
            </div>
        `).join('') || "<p style='color:#ccc;'>Vault Empty. Admin upload required.</p>";
    </script>
</body>
</html>
