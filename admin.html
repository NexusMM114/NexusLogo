<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Vault | Imperial Admin</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap">
    <style>
        :root {
            --gold: #FFD700;
            --saffron: #FF9933;
            --green: #128807;
        }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            padding: 40px;
        }
        .container { max-width: 1000px; margin: auto; }
        h1 { border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #111; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background: var(--gold); color: #000; }
        .utr { color: var(--saffron); font-family: monospace; font-weight: bold; }
        .btn { 
            background: var(--gold); border: none; padding: 10px 20px; 
            cursor: pointer; font-weight: 900; border-radius: 5px; margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="gold-gradient">👑 IMPERIAL LOGS</h1>
        <div style="margin: 20px 0;">
            <button class="btn" onclick="exportData()">Export CSV</button>
            <button class="btn" style="background:red; color:white;" onclick="clearLogs()">Clear All Logs</button>
        </div>
        <table id="adminTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Codes</th>
                    <th>UTR</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="adminBody"></tbody>
        </table>
    </div>

    <script>
        // Security Prompt
        const pass = prompt("Enter Admin Password:");
        if (pass !== "Nexus786") {
            alert("Access Denied");
            window.location.href = "index.html";
        }

        function loadLogs() {
            const logs = JSON.parse(localStorage.getItem('nexus_admin_orders')) || [];
            const body = document.getElementById('adminBody');
            body.innerHTML = logs.map(l => `
                <tr>
                    <td>${l.date}</td>
                    <td>${l.name} (@${l.tg})</td>
                    <td>${l.codes}</td>
                    <td class="utr">${l.utr}</td>
                    <td>₹${l.total}</td>
                </tr>
            `).reverse().join('');
        }

        function exportData() {
            const logs = JSON.parse(localStorage.getItem('nexus_admin_orders')) || [];
            let csv = "Date,Name,Telegram,Codes,UTR,Total\n";
            logs.forEach(l => csv += `${l.date},${l.name},${l.tg},${l.codes},${l.utr},${l.total}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Nexus_Orders.csv');
            a.click();
        }

        function clearLogs() {
            if(confirm("Are you sure? This will delete all order history.")) {
                localStorage.removeItem('nexus_admin_orders');
                loadLogs();
            }
        }

        loadLogs();
    </script>
</body>
</html>
