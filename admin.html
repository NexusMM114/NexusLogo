<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus | Command</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1510511459019-5dda7724fd87?q=80&w=1920&auto=format&fit=crop'); background-size: cover; }
        .admin-nav { display: flex; overflow-x: auto; background: rgba(0,0,0,0.95); padding: 15px; border-bottom: 2px solid var(--neon-purple); white-space: nowrap; position: sticky; top: 0; z-index: 99; }
        .nav-item { color: #888; margin-right: 20px; font-weight: bold; cursor: pointer; }
        .active-nav { color: var(--neon-blue); border-bottom: 2px solid var(--neon-blue); }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: rgba(0,0,0,0.5); border: 1px solid #444; color: white; border-radius: 5px; }
        .data-card { background: rgba(0,0,0,0.8); padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; font-size: 0.9rem; }
        label { color: var(--neon-purple); font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="admin-nav">
        <div class="nav-item active-nav" onclick="tab('up',this)">📤 UPLOAD</div>
        <div class="nav-item" onclick="tab('prod',this)">📦 GALLERY</div>
        <div class="nav-item" onclick="tab('req',this)">🔑 RESETS</div>
        <div class="nav-item" onclick="tab('pay',this)">💸 PAYMENTS</div>
        <div class="nav-item" style="color:#ff0055" onclick="location.href='login.html'">LOGOUT</div>
    </div>

    <div id="up" class="container">
        <div class="data-card">
            <h3 style="color:var(--neon-blue); margin-top:0;">BRAND SETTINGS</h3>
            <input type="text" id="set-pfp" placeholder="Admin PFP Image Link">
            <button class="btn" onclick="saveSet()">UPDATE PFP</button>

            <h3 style="color:var(--neon-purple); border-top:1px solid #444; padding-top:20px;">UPLOAD PRODUCT</h3>
            <label>CATEGORY</label>
            <select id="p-type"><option value="logo">Logo</option><option value="qr">QR</option><option value="sticker">Sticker</option></select>
            <label>NAME</label><input type="text" id="p-name" placeholder="Item Name">
            <label>PRICE (₹)</label><input type="number" id="p-price" placeholder="Price">
            <label style="color:var(--neon-blue);">UPLOAD FROM GALLERY</label>
            <input type="file" id="p-file" accept="image/*" style="padding:5px;">
            <p style="font-size:0.7rem; color:gray; margin:0;">OR PASTE IMAGE LINK</p>
            <input type="text" id="p-img" placeholder="https://...">
            <button class="btn" style="border-color:var(--neon-purple); color:var(--neon-purple); margin-top:15px;" onclick="processUpload()">UPLOAD TO SHOP</button>
        </div>
    </div>

    <div id="prod" class="container hidden"></div>
    <div id="req" class="container hidden"></div>
    <div id="pay" class="container hidden"></div>

    <script src="script.js"></script>
    <script>
        function tab(id, btn) { ['up','prod','req','pay'].forEach(x => document.getElementById(x).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active-nav')); btn.classList.add('active-nav'); refresh(); }
        
        function saveSet() { localStorage.setItem('nexus_settings', JSON.stringify({pfp: document.getElementById('set-pfp').value})); alert("Updated!"); location.reload(); }
        
        function processUpload() {
            const fileInput = document.getElementById('p-file'); const urlInput = document.getElementById('p-img').value;
            const name = document.getElementById('p-name').value; const price = document.getElementById('p-price').value; const type = document.getElementById('p-type').value;
            if (!name || !price) return alert("Enter Name and Price");
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { saveToStore(type, name, price, e.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else if (urlInput) { saveToStore(type, name, price, urlInput); } else { alert("Select a file or paste a link."); }
        }
        function saveToStore(type, name, price, imgData) {
            let items = JSON.parse(localStorage.getItem('nexus_products') || "[]");
            items.push({id: Date.now(), type, name, price, img: imgData});
            localStorage.setItem('nexus_products', JSON.stringify(items));
            alert("UPLOADED SUCCESSFULLY!");
            document.getElementById('p-name').value = ""; document.getElementById('p-price').value = ""; document.getElementById('p-file').value = ""; document.getElementById('p-img').value = ""; refresh();
        }

        function refresh() {
            const items = JSON.parse(localStorage.getItem('nexus_products') || "[]");
            document.getElementById('prod').innerHTML = items.map(x => `<div class="data-card" style="display:flex; gap:10px; align-items:center;"><img src="${x.img}" style="width:40px; height:40px; border-radius:5px; object-fit:cover;"> <div style="flex:1;"><b>${x.name}</b> (₹${x.price})<br><small>${x.type.toUpperCase()}</small></div> <button style="color:#ff0055; background:none; border:none; font-weight:bold; cursor:pointer;" onclick="delP(${x.id})">DEL</button></div>`).join('') || "<p>No Products</p>";

            const reqs = JSON.parse(localStorage.getItem('nexus_reset_reqs') || "[]");
            document.getElementById('req').innerHTML = reqs.map((x,i) => `<div class="data-card"><b>${x.email}</b><br><small>${x.date}</small><div style="margin-top:10px;"><button class="btn" style="padding:5px; width:auto; display:inline-block;" onclick="generateLink('${x.email}')">COPY LINK</button> <button class="btn" style="border-color:#ff0055; color:#ff0055; padding:5px; width:auto; display:inline-block;" onclick="delReq(${i})">DELETE</button></div></div>`).join('') || "<p>No Requests</p>";

            const pays = JSON.parse(localStorage.getItem('nexus_orders') || "[]");
            document.getElementById('pay').innerHTML = pays.map((x,i) => `<div class="data-card"><b>${x.name}</b> - @${x.user} <br>Status: <span style="color:${x.status=='PENDING'?'yellow':'lime'}">${x.status}</span> ${x.status=='PENDING' ? `<button class="btn" style="border-color:lime; color:lime; padding:5px; float:right; width:auto;" onclick="approve(${i})">APPROVE</button>` : ''}</div>`).join('') || "<p>No Orders</p>";
        }

        function generateLink(email) {
            const code = btoa(email); 
            const baseUrl = window.location.href.replace('admin.html', 'login.html');
            navigator.clipboard.writeText(baseUrl + "?reset=" + code).then(() => alert("✅ LINK COPIED!\n\nPaste in Telegram."));
        }

        function delP(id) { let items = JSON.parse(localStorage.getItem('nexus_products')); localStorage.setItem('nexus_products', JSON.stringify(items.filter(x => x.id != id))); refresh(); }
        function delReq(i) { let d=JSON.parse(localStorage.getItem('nexus_reset_reqs')); d.splice(i,1); localStorage.setItem('nexus_reset_reqs', JSON.stringify(d)); refresh(); }
        function approve(i) { let d=JSON.parse(localStorage.getItem('nexus_orders')); d[i].status="APPROVED"; localStorage.setItem('nexus_orders', JSON.stringify(d)); refresh(); }
        refresh();
    </script>
</body>
</html>
