<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NexusLogo | Republic Vault 🇮🇳</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap">
    <style>
        :root {
            --gold-primary: #FFD700;
            --gold-dark: #B8860B;
            --saffron: #FF9933;
            --green: #128807;
            --navy: #000080;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(15, 15, 15, 0.9);
        }

        body {
            margin: 0;
            /* --- Tricolor Flag Background Logic --- */
            background: linear-gradient(
                to bottom, 
                rgba(255, 153, 51, 0.1) 0%,   
                rgba(10, 10, 10, 1) 50%,  
                rgba(18, 136, 7, 0.1) 100%    
            ),
            radial-gradient(circle at center, #1a1215 0%, #0a0a0a 100%);
            background-attachment: fixed;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Falling Republic Petals --- */
        .petal { position: fixed; top: -10%; border-radius: 50% 0 50% 50%; opacity: 0.6; pointer-events: none; z-index: 1; animation: fall linear infinite; width: 12px; height: 12px; }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(0,0,0,0.95); border-top: 5px solid var(--saffron); border-bottom: 5px solid var(--green); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); box-shadow: 0 4px 20px rgba(0,0,128,0.3); }
        .gold-gradient { background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        
        #timer-clock { font-family: monospace; color: #fff; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 8px; border: 1px solid var(--saffron); font-size: 14px; transition: 0.5s; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; padding: 40px 5%; max-width: 1400px; margin: 0 auto; z-index: 2; position: relative; }
        .shop-box { background: var(--card-bg); border: 1px solid rgba(255, 215, 0, 0.1); backdrop-filter: blur(12px); border-radius: 2rem; padding: 20px; text-align: center; transition: 0.4s ease; position: relative; }
        .shop-box:hover { transform: translateY(-10px); border-color: var(--gold-primary); box-shadow: 0 15px 30px rgba(255, 215, 0, 0.2); }
        .shop-box img, .shop-box iframe { width: 100%; height: 220px; object-fit: contain; border-radius: 1.5rem; margin-bottom: 15px; background: #000; border: none; }

        .discount-tag { position: absolute; top: 15px; right: 15px; background: red; color: white; padding: 4px 10px; border-radius: 10px; font-size: 10px; font-weight: 900; z-index: 5; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .gold-btn { background: linear-gradient(90deg, var(--gold-dark), var(--gold-primary)); color: #000; font-weight: 900; text-transform: uppercase; padding: 15px; border: none; border-radius: 12px; cursor: pointer; width: 100%; transition: 0.3s; }
        .gold-btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--gold-primary); }
        
        .cart-counter-btn { border: 2px solid var(--gold-primary); background: transparent; color: var(--gold-primary); padding: 10px 20px; border-radius: 30px; font-weight: 900; cursor: pointer; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .modal-content { background: #0f0f0f; padding: 30px; border-radius: 2rem; width: 90%; max-width: 420px; border: 1px solid var(--gold-dark); max-height: 90vh; overflow-y: auto; text-align: center; }
        .imperial-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--gold-dark); background: #000; color: #fff; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        
        #lastChancePopup { border: 3px solid #ff4444; }

        @media (max-width: 600px) { header { flex-direction: column; text-align: center; gap: 15px; } }
    </style>
</head>
<body>

<header>
    <div class="gold-gradient" style="font-size: 1.5rem;">NEXUS VAULT</div>
    <div id="countdown-timer" style="color: var(--saffron); font-size: 0.85rem; font-weight: 800;">
        SALE ENDS: <span id="timer-clock">00:00:00:00</span>
    </div>
    <button class="cart-counter-btn" onclick="toggleCart()">VAULT (<span id="count">0</span>)</button>
</header>

<div class="grid" id="productGrid"></div>

<div id="cartModal" class="modal">
    <div class="modal-content">
        <div id="step1">
            <h2 class="gold-gradient">VAULT ITEMS</h2>
            <div id="itemsList"></div>
            <p id="promoMsg" style="font-size:11px; color:var(--saffron); margin: 15px 0; font-weight:700;"></p>
            <div style="display:flex; justify-content:space-between; font-size: 1.5rem; font-weight: 900;">
                <span>TOTAL</span>
                <span class="gold-gradient" id="finalTotal">₹0</span>
            </div>
            <button class="gold-btn" style="margin-top:20px;" onclick="goToStep(2)">Owner Details</button>
            <button onclick="toggleCart()" style="background:none; border:none; color:gray; width:100%; margin-top:15px; cursor:pointer;">Close</button>
        </div>

        <div id="step2" style="display:none;">
            <h2 class="gold-gradient">DETAILS</h2>
            <input type="text" id="custName" placeholder="Full Name" class="imperial-input">
            <input type="text" id="custContact" placeholder="Telegram @username" class="imperial-input">
            <button class="gold-btn" onclick="goToStep3()">Generate QR</button>
            <button onclick="goToStep(1)" style="background:none; border:none; color:gray; width:100%; margin-top:10px;">Back</button>
        </div>

        <div id="step3" style="display:none;">
            <h2 class="gold-gradient">SCAN & PAY</h2>
            <div style="background:white; padding:10px; border-radius:15px; display:inline-block; margin-bottom:10px;">
                <img id="upiQR" src="" style="width:160px; height:160px;">
            </div>
            <p style="font-weight:bold; color:var(--gold-primary);">Total: ₹<span id="payAmt"></span></p>
            <input type="text" id="utrInput" placeholder="Enter 12-Digit UTR" class="imperial-input" style="border-color:var(--green);">
            <button class="gold-btn" onclick="finalizeOrder()">Submit Order</button>
        </div>
    </div>
</div>

<div id="lastChancePopup" class="modal">
    <div class="modal-content">
        <h1 style="font-size: 3rem;">⏳</h1>
        <h2 style="color:#ff4444; font-weight: 900;">URGENT!</h2>
        <p>Republic Day Sale ends in under 2 hours! Grab your logos at ₹18 before the price returns to ₹20.</p>
        <button class="gold-btn" onclick="closePopup('lastChancePopup')" style="background: #ff4444; color: white;">SHOP NOW</button>
    </div>
</div>

<footer style="text-align:center; padding:40px; opacity:0.6; font-size:12px;">
    © 2026 NEXUSLOGO STORE | JAI HIND 🇮🇳
</footer>

<script>
    const logoIDs = [
        "1YlgTBlmedNDXqLF-FaWvYMu7JSKQb_J3", "1Rfke6YZ1xqlDYkY_NxuCLeFWhfBSZqD7", 
        "1_8BeyKLtRexUgWmg9ffbWDbmgLXHOh", "1uBpqchVRhWv-AeVcuGuSUqqcRExq26xY",
        "1z_dMjlBOuytoNwONO-CEQ-VlwNRv08jB", "1YV3twVhH109nY7tloC2xJwB2MNPalr0X",
        "1sHJloN37codYBBbf6kOXzMF4JS5UvTnz", "1TIEdQ7fgFZwyVawNym2KiTLV19gWX5-P",
        "146tk4YgJccqOlHB1wwldnc2d7igTU-VH", "1LAnRd_AkSzOUhT879Hk1EIUARwMLLA8Z",
        "1j7fOTqq4kSuWCJ2NR9ImWmcy-C-_ReDS", "1kcU66rGLI6PxVlxcatt0B_hqi69mpdIr",
        "1jwuJ_hGw0Q3tupZ2CnnP450pDsvLveNi", "1xZzSe0_hT8Q8CUD9If2q3VA9aEvE_ZaK",
        "1KCNxHjigvw_pQiJK4_aMTvX6Y0QiROik", "1v_DUcEPF4H5LyK-ttaI5X6r3oZjml0aF",
        "1HWu5eqyXJ3KjeNwdNVvzkWu15zjB7DnJ", "15v_gaPAU3NWpsK0hPfdnH7wWS9DMSIh3",
        "1KFvSQG84R94V-oscSkgxyw9_pGMHbLRr", "1PX3voz_QOMfxzObDYsDgq_e6ahF7Tw6i",
        "1HAVGGaO5itHyDhcf8Ct3XNrwDyrLDu_n",
        "1JWGYxoMn6cq0wG8z1rvejLHXJIt518-7"
    ];

    const grid = document.getElementById('productGrid');
    logoIDs.forEach((id, i) => {
        const code = `NX${(i + 1).toString().padStart(2, '0')}`;
        grid.innerHTML += `
            <div class="shop-box">
                <div class="discount-tag">10% OFF</div>
                ${id === "1HWu5eqyXJ3KjeNwdNVvzkWu15zjB7DnJ" ? `<iframe src="https://drive.google.com/file/d/${id}/preview"></iframe>` : `<img src="https://drive.google.com/thumbnail?id=${id}&sz=w1000">`}
                <h3 class="gold-gradient">${code}</h3>
                <div style="font-size: 1.3rem; font-weight: 900; margin: 10px 0;">
                    <span style="text-decoration:line-through; font-size:0.9rem; opacity:0.4;">₹20</span> ₹18
                </div>
                <button class="gold-btn" onclick="addToCart('${code}')">Add to Vault</button>
            </div>`;
    });

    let cart = JSON.parse(localStorage.getItem('nexus_vault')) || [];
    function save() { localStorage.setItem('nexus_vault', JSON.stringify(cart)); document.getElementById('count').innerText = cart.length; }
    function addToCart(code) { cart.push(code); save(); }
    function toggleCart() { document.getElementById('cartModal').style.display = (document.getElementById('cartModal').style.display === 'flex') ? 'none' : 'flex'; renderCart(); }
    function closePopup(id) { document.getElementById(id).style.display = 'none'; }

    function renderCart() {
        const list = document.getElementById('itemsList');
        list.innerHTML = cart.length ? cart.map((item, i) => `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span><b>${item}</b></span><span>₹18</span><button onclick="cart.splice(${i},1); save(); renderCart();" style="color:red; background:none; border:none; cursor:pointer;">✕</button></div>`).join('') : 'Vault is empty.';
        let subtotal = cart.length * 18;
        let discount = (cart.length >= 10) ? 50 : (cart.length >= 5 ? 20 : 0);
        let final = subtotal - discount;
        document.getElementById('finalTotal').innerText = '₹' + (final < 0 ? 0 : final);
        document.getElementById('promoMsg').innerText = cart.length >= 10 ? "🇮🇳 MAX BULK DISCOUNT ACTIVE!" : (cart.length >= 5 ? "₹20 OFF Applied!" : "Buy 5 for extra ₹20 OFF!");
    }

    function goToStep(n) { [1,2,3].forEach(s => document.getElementById('step'+s).style.display = (s===n?'block':'none')); }
    function goToStep3() {
        let final = (cart.length * 18) - (cart.length >= 10 ? 50 : (cart.length >= 5 ? 20 : 0));
        document.getElementById('payAmt').innerText = final;
        document.getElementById('upiQR').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(`upi://pay?pa=Lavyanshboss@fam&pn=NexusLogo&am=${final}&cu=INR`)}`;
        goToStep(3);
    }
    function finalizeOrder() {
        const utr = document.getElementById('utrInput').value;
        if(utr.length < 6) return alert("Invalid UTR!");
        window.open(`https://t.me/Nexusmm?text=🇮🇳 *REPUBLIC ORDER*%0A👤 Name: ${document.getElementById('custName').value}%0A📦 Items: ${cart.join(", ")}%0A💰 Paid: ₹${document.getElementById('payAmt').innerText}%0A🔑 UTR: ${utr}`);
        cart = []; save(); toggleCart();
    }

    // --- Timer & Alert Logic ---
    let popupShown = false;
    function startTimer() {
        const endTime = new Date().getTime() + (48 * 60 * 60 * 1000);
        const clock = document.getElementById("timer-clock");
        setInterval(() => {
            const now = new Date().getTime();
            const diff = endTime - now;
            if (diff < 0) { clock.innerText = "EXPIRED"; return; }
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            clock.innerText = `${d}d ${h}h ${m}m ${s}s`;

            if (diff < 7200000) { // 2 Hours
                clock.style.color = "#ff4444";
                clock.style.borderColor = "#ff4444";
                clock.style.boxShadow = "0 0 10px #ff4444";
                if (!popupShown) { document.getElementById('lastChancePopup').style.display = 'flex'; popupShown = true; }
            }
        }, 1000);
    }

    // --- Republic Petals ---
    setInterval(() => {
        const p = document.createElement('div'); p.className = 'petal';
        const c = ['#FF9933', '#FFFFFF', '#128807'];
        p.style.backgroundColor = c[Math.floor(Math.random() * 3)];
        p.style.left = Math.random() * 100 + 'vw'; p.style.animationDuration = (Math.random()*3+2)+'s';
        document.body.appendChild(p); setTimeout(() => p.remove(), 5000);
    }, 400);

    startTimer();
    save();
</script>
</body>
</html>
