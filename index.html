<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: linear-gradient(rgba(5, 5, 5, 0.7), rgba(5, 5, 5, 0.7)), url('https://images.unsplash.com/photo-1535868463750-c78d9543614f?q=80&w=1920&auto=format&fit=crop'); background-attachment: fixed; background-size: cover; }
    </style>
</head>
<body>
    <nav>
        <div class="brand" onclick="location.href='index.html'">NEXUS</div>
        <div class="nav-links"><a href="logo.html">SHOP</a><a href="login.html" id="nav-auth">LOGIN</a></div>
    </nav>

    <div class="featured-wrapper">
        <div id="featured-spot"></div>
    </div>

    <div class="container" style="text-align:center; padding-top:20px;">
        <h1 style="font-size:3rem; margin:0; line-height:1; color: white; text-shadow: 0 0 15px var(--neon-purple);">DIGITAL<br>ARMORY</h1>
        <p style="color:var(--neon-blue); margin-top:5px; letter-spacing:3px; font-size:0.8rem; font-weight:bold;">PREMIUM CYBER ASSETS</p>
        <br>
        <button class="btn" style="max-width:200px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);" onclick="location.href='logo.html'">ENTER VAULT</button>
    </div>

    <script src="script.js"></script>
    <script>
        const products = JSON.parse(localStorage.getItem('nexus_products') || "[]");
        if(products.length > 0) {
            const feat = products[products.length - 1];
            document.getElementById('featured-spot').innerHTML = `
                <div class="featured-card">
                    <div class="featured-tag">🔥 LATEST UPLOAD</div>
                    <img src="${feat.img}" class="featured-img">
                    <h2 style="margin:10px 0 5px 0; color:var(--neon-blue)">${feat.name}</h2>
                    <p style="color:#aaa; font-size:0.9rem; margin-bottom:15px;">Price: ₹${feat.price}</p>
                    <button class="btn" style="background:var(--neon-blue); color:black;" onclick="buyItem('${feat.name}', ${feat.price}, '${feat.img}')">ACQUIRE</button>
                </div>`;
        } else { document.getElementById('featured-spot').style.display = 'none'; }
    </script>
</body>
</html>
