<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Access</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Internal Styling to ensure it looks good even if style.css fails */
        body { background-color: #050505; color: white; font-family: sans-serif; }
        .container { display:flex; justify-content:center; align-items:center; min-height:90vh; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 30px; width: 100%; max-width: 350px; text-align: center;
        }
        input {
            width: 100%; padding: 12px; margin: 10px 0; background: rgba(0,0,0,0.5);
            border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px; margin-top: 15px;
            background: transparent; border: 1px solid #bd00ff; color: #bd00ff;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:active { background: #bd00ff; color: white; }
        
        .hidden { display: none; }
        .link { color: #00f3ff; cursor: pointer; text-decoration: underline; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-panel">
            
            <div id="section-login">
                <h2 style="color:#bd00ff; letter-spacing:2px;">SYSTEM ACCESS</h2>
                
                <input type="email" id="inp-email" placeholder="Email (youremail@gmail.com)">
                <input type="password" id="inp-pass" placeholder="Password (••••••••••)">
                
                <p style="text-align:right; font-size:0.8em;">
                    <span class="link" style="color:#ff0055" onclick="showSection('section-forgot')">Forgot Passcode?</span>
                </p>

                <button type="button" onclick="tryLogin()">INITIALIZE SESSION</button>
                
                <p style="margin-top:20px; color:#888; font-size:0.9em;">
                    New Agent? <span class="link" onclick="showSection('section-register')">Create Identity</span>
                </p>
            </div>

            <div id="section-register" class="hidden">
                <h2 style="color:#00f3ff; letter-spacing:2px;">NEW IDENTITY</h2>
                
                <input type="email" id="reg-email" placeholder="New Email">
                <input type="text" id="reg-tele" placeholder="Telegram @username">
                <input type="password" id="reg-pass" placeholder="Create Password">

                <button type="button" style="border-color:#00f3ff; color:#00f3ff;" onclick="tryRegister()">REGISTER</button>
                
                <p style="margin-top:20px; color:#888; font-size:0.9em;">
                    Has Account? <span class="link" onclick="showSection('section-login')">Login Here</span>
                </p>
            </div>

            <div id="section-forgot" class="hidden">
                <h2 style="color:#ff0055">RECOVERY</h2>
                <input type="email" id="forgot-email" placeholder="Registered Email">
                <button type="button" style="border-color:#ff0055; color:#ff0055;" onclick="tryReset()">SEND REQUEST</button>
                <p style="margin-top:20px;"><span class="link" onclick="showSection('section-login')">Cancel</span></p>
            </div>

        </div>
    </div>

    <script>
        // 1. Navigation Logic
        function showSection(id) {
            document.getElementById('section-login').style.display = 'none';
            document.getElementById('section-register').style.display = 'none';
            document.getElementById('section-forgot').style.display = 'none';
            
            document.getElementById(id).style.display = 'block';
        }

        // 2. Login Logic
        function tryLogin() {
            // Get values using the NEW IDs
            const email = document.getElementById('inp-email').value.trim();
            const pass = document.getElementById('inp-pass').value.trim();

            // Debug Alert (Remove later if annoying)
            // alert("Checking credentials for: " + email); 

            if (!email || !pass) {
                alert("Please enter both Email and Password.");
                return;
            }

            // ADMIN CHECK
            if (email === "admin@nexuslogo.shop" && pass === "NexusAdmin12") {
                const adminUser = { email: email, telegram: "NexusMM", role: "admin" };
                localStorage.setItem('nexus_user', JSON.stringify(adminUser));
                window.location.href = "admin.html";
                return;
            }

            // USER CHECK from Database
            const users = JSON.parse(localStorage.getItem('nexus_db') || "[]");
            const found = users.find(u => u.email === email && u.pass === pass);

            if (found) {
                localStorage.setItem('nexus_user', JSON.stringify(found));
                window.location.href = "index.html"; // Redirect to Home
            } else {
                alert("ACCESS DENIED: Wrong email or password.");
            }
        }

        // 3. Register Logic
        function tryRegister() {
            const email = document.getElementById('reg-email').value.trim();
            const tele = document.getElementById('reg-tele').value.trim().replace('@','');
            const pass = document.getElementById('reg-pass').value.trim();

            if (!email || !tele || !pass) return alert("Fill all fields.");

            const users = JSON.parse(localStorage.getItem('nexus_db') || "[]");
            if (users.find(u => u.email === email)) return alert("Email already exists.");

            const newUser = { email: email, telegram: tele, pass: pass, role: 'user' };
            users.push(newUser);
            
            localStorage.setItem('nexus_db', JSON.stringify(users));
            localStorage.setItem('nexus_user', JSON.stringify(newUser));
            
            alert("Identity Created!");
            window.location.href = "index.html";
        }

        // 4. Reset Logic
        function tryReset() {
            const email = document.getElementById('forgot-email').value;
            if(email) {
                alert("Request Sent to Admin.");
                showSection('section-login');
            } else {
                alert("Enter email.");
            }
        }
    </script>
</body>
</html>
