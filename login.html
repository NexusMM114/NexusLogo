<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        :root { --neon-purple: #bd00ff; --neon-blue: #00f3ff; }
        * { box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { margin: 0; background: #050505; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        .card { background: rgba(10,10,10,0.9); border: 1px solid var(--neon-blue); padding: 30px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 1px solid #444; color: white; border-radius: 6px; outline: none; }
        .btn { background: var(--neon-blue); color: black; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:var(--neon-blue)">AGENT LOGIN</h2>
        <input type="email" id="e" placeholder="Email">
        <input type="password" id="p" placeholder="Password">
        <button class="btn" onclick="login()">INITIALIZE</button>
        <p style="font-size:0.8rem; margin-top:15px; color:#aaa;">New? <span style="color:var(--neon-blue); cursor:pointer;" onclick="reg()">Create ID</span> | <span style="color:#ff0055; cursor:pointer;" onclick="forget()">Forgot?</span></p>
    </div>
    <script>
        function login() {
            const email = document.getElementById('e').value;
            const pass = document.getElementById('p').value;
            if(email === "admin@nexuslogo.shop" && pass === "admin123") {
                localStorage.setItem('nexus_user', JSON.stringify({role:'admin'}));
                location.href = "admin.html";
            } else {
                const db = JSON.parse(localStorage.getItem('nexus_db') || "[]");
                const u = db.find(x => x.email === email && x.pass === pass);
                if(u) { localStorage.setItem('nexus_user', JSON.stringify(u)); location.href="index.html"; } else { alert("ACCESS DENIED"); }
            }
        }
        function reg() { 
            const email = prompt("Enter Email:"); const tele = prompt("Enter Telegram @:"); const pass = prompt("Enter Pass:");
            if(email && tele && pass) {
                let db = JSON.parse(localStorage.getItem('nexus_db') || "[]");
                db.push({email, telegram: tele.replace('@',''), pass, role:'user'});
                localStorage.setItem('nexus_db', JSON.stringify(db)); alert("ID CREATED");
            }
        }
        function forget() {
            const email = prompt("Enter your registered email:");
            if(email) { window.open(`https://t.me/NexusmM?text=🔑 RESET REQUEST: ${email}`, '_blank'); }
        }
    </script>
</body>
</html>
